# Applied to every cluster (dev and prod), verbatim. Talos 1.14 multi-document format.
# Cilium replaces both flannel and kube-proxy.
apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
$patch: delete
---
apiVersion: v1alpha1
kind: KubeProxyConfig
enabled: false
---
# Cloudflare's NTS time servers (the Talos default) time out on UDP 123 from our NAT networks,
# which leaves etcd waiting for time sync. Use plain NTP from Google and the pool instead.
apiVersion: v1alpha1
kind: TimeSyncConfig
ntp:
  servers:
    - time.google.com
    - pool.ntp.org
