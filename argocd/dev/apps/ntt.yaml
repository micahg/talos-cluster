# The chart and its settings live in the tbltp repo (chart/values.yaml, chart/values-dev.yaml).
# Only the version pins live in this repo (envs/dev/ntt.yaml); tbltp's CI bumps them through a
# pull request here.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ntt
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: https://github.com/micahg/tbltp.git
      targetRevision: main
      path: chart
      helm:
        releaseName: ntt-infra
        valueFiles:
          - values.yaml
          - values-dev.yaml
          - $values/envs/dev/ntt.yaml
    - repoURL: https://github.com/micahg/talos-cluster.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: ntt
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
