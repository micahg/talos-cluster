# The chart and its settings live in the cobblepod repo (chart/values.yaml, chart/values-dev.yaml).
# Only the image tags live in this repo (envs/dev/cobblepod.yaml); cobblepod's release workflow
# bumps them through a pull request here.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cobblepod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: https://github.com/micahg/cobblepod.git
      targetRevision: main
      path: chart
      helm:
        releaseName: cobblepod
        valueFiles:
          - values.yaml
          - values-dev.yaml
          - $values/envs/dev/cobblepod.yaml
    - repoURL: https://github.com/micahg/talos-cluster.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: cobblepod-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
