# SealedSecrets for cobblepod (encrypted; safe to commit). Also creates the cobblepod-dev namespace.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cobblepod-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/micahg/talos-cluster.git
    targetRevision: main
    path: apps/cobblepod/secrets/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: cobblepod-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
