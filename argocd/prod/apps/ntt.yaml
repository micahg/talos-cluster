# Chart and settings come from tbltp (chart/values.yaml, whose defaults are prod); only the version pins
# live here (envs/prod/ntt.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ntt
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: https://github.com/micahg/tbltp.git
      targetRevision: v0.67.0
      path: chart
      helm:
        releaseName: ntt-infra
        valueFiles:
          - values.yaml
          - $values/envs/prod/ntt.yaml
    - repoURL: https://github.com/micahg/talos-cluster.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: ntt
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
